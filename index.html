        moveDescriptions: "Jab (Peashooter Rapid Fire): Holds his finger-gun out to fire a continuous stream of rapid 1930s cartoon Peashooter bullets while walking forward or backward. | Neutral B (EX Weapon Swap & Fire): Fires his current weapon (Peashooter, Spread, Chaser); holding B opens an ammo wheel to swap firing types on the fly. | Side B (Smoke Dash): Performs a high-speed dash enveloped in a puff of invulnerable smoke, passing straight through enemies and projectiles. | Up B (Ghost Super Launch): Cuphead's spirit leaves his body and launches upward, pulling his physical body behind him in a cloud of pink parry hearts. | Down B (Parry Slap / Super Art I Beam): Performs a downward slap; slapping a projectile or enemy parries it for invulnerability and charges his Super Meter. At max meter, fires a massive 360-degree liquid laser beam.",
        combos: "EX Peashooter Blast: QCF + B | Super Art Beam: d,df,f + A",
        lore: "After making a bad deal with the Devil at the Inkwell Hell Casino, Cuphead must collect soul contracts across Inkwell Isle. Armed with finger-gun magic bestowed by the Elder Kettle, Cuphead zones opponents with varied ammo types and rubber-hose acrobatics. | Mugman is Cuphead's cautious blue brother who shares his kit with custom blue finger-laser FX and timid victory animations. | Ms. Chalice is a brave spirit rescued from the Astral Plane in The Delicious Last Course. When selected as an alt, Ms. Chalice features unique passive mobility: a built-in Double Jump, an invulnerable Dodge Roll on dash, and a Parry Dash in mid-air.",
        skins: "Classic Red Cuphead, Mugman (Model Swap), Ms. Chalice (Model Swap), Evil Cuphead, Black & White 1930s, Golden Chalice, Inkwell Blue, Retro Sepia" },

      // Slot #116: DOOM
      "Doom Slayer": {
        publisher: "Bethesda / id Software",
        series: "DOOM",
        weight: "Super Heavyweight",
        archetype: "Heavy Arsenal & Glory Kill Striker",
        moves: "Jab: Doomblade & Elbow Strike | F-Smash: Super Shotgun Point-Blank Blast | U-Smash: Rocket Launcher Upper | D-Smash: Chainsaw Floor Sweep | FAir: Heavy Melee Spike | Neutral B: Plasma Rifle / Super Shotgun Swap | Side B: Flame Belch & Shoulder Cannon | Up B: Meathook Chain Vault | Down B: BFG 9000 Charge Blast",
        moveDescriptions: "Jab (Doomblade & Elbow Strike): Extends his wrist-mounted Doomblade for a quick stab, follows with a heavy elbow smash, and finishes with a brutal front boot kick! | Neutral B (Plasma Rifle / Super Shotgun Swap): Fires rapid plasma or shotgun pellets; tapping Down-B while holding Neutral-B swaps active heavy guns. | Side B (Flame Belch & Shoulder Cannon): Fires a shoulder-mounted flamethrower that burns foes, causing them to drop armor shard items that heal the Slayer. | Up B (Meathook Chain Vault): Fires a grappled meat-hook from his Super Shotgun into an opponent or ledge, pulling himself forward into a flying kick. | Down B (BFG 9000 Charge Blast): Charges up the Bio-Force Gun to launch a massive, slow-moving green plasma sphere that fires energy arcs across the screen.",
        combos: "Glory Kill Finisher: f,f + A | Meathook Shotgun Blast: Side-B -> Neutral-B",
        lore: "The unyielding Sentinel warrior who has waged an eternal war against the armies of Hell. Equipped with Praetor Suit armor, a shoulder-mounted grenade launcher, the Meathook Super Shotgun, and the BFG 9000.",
        skins: "Classic 1993 Green Armor, DOOM Eternal Praetor Suit, Astro Armor White, Phobos Orange, Crimson Slayer, Marauder Motif, Gold Armor, Retro 8-Bit" }
    };

    // =========================================================================
    // 5. CORE GRID RENDERING & SORTING ENGINE
    // =========================================================================
    function init() {
      // Populate series dropdown
      const seriesSet = new Set(roster.map(u => u.series));
      const sortedSeries = Array.from(seriesSet).sort();
      const seriesSelect = document.getElementById('seriesFilter');
      sortedSeries.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s;
        opt.textContent = s;
        seriesSelect.appendChild(opt);
      });

      setActivePlayer(0);
      for (let i = 0; i < 4; i++) {
        updatePlayerUI(i);
      }
      renderGrid();
    }

    function getVariantName(unit, mode) {
      if (mode === 0) return unit.anchor;
      if (mode === 1) return unit.echo;
      return unit.kaizo;
    }

    function getModeRoleClass(mode) {
      if (mode === 0) return 'role-anchor';
      if (mode === 1) return 'role-echo';
      return 'role-kaizo';
    }

    function getSortGroupInfo(unit, sortMode) {
      if (sortMode === 'history') {
        const gId = getHistoryEraId(unit.historyYear);
        const lbl = historyEraDescriptions[gId] || historyEras[gId] || 'ERA';
        return {
          key: gId,
          id: gId,
          title: lbl,
          label: lbl,
          colorClass: historyErasColors[gId] || 'theme-cyan',
          colorKey: historyErasColors[gId] || 'theme-cyan'
        };
      }
      if (sortMode === 'corp') {
        const gId = unit.corpGroup || 1;
        const lbl = corpGroups[gId] ? corpGroups[gId].split('(')[0].trim() : 'FACTION';
        return {
          key: gId,
          id: gId,
          title: lbl,
          label: lbl,
          colorClass: corpGroupsColors[gId] || 'theme-cyan',
          colorKey: corpGroupsColors[gId] || 'theme-cyan'
        };
      }
      if (sortMode === 'theme') {
        const gId = unit.themeGroup || 1;
        const lbl = themeGroups[gId] || 'ENSEMBLE';
        return {
          key: gId,
          id: gId,
          title: lbl,
          label: lbl,
          colorClass: themeGroupsColors[gId] || 'theme-cyan',
          colorKey: themeGroupsColors[gId] || 'theme-cyan'
        };
      }
      if (sortMode === 'pantheon') {
        const gId = unit.pantheonGroup || 1;
        const lbl = pantheonGroups[gId] || 'ALLIANCE';
        return {
          key: gId,
          id: gId,
          title: lbl,
          label: lbl,
          colorClass: pantheonThemeColors[gId] || 'theme-cyan',
          colorKey: pantheonThemeColors[gId] || 'theme-cyan'
        };
      }
      return { key: 0, id: 0, title: '', label: '', colorClass: 'theme-cyan', colorKey: 'theme-cyan' };
    }

    function getGroupInfo(unit, sortMode) {
      return getSortGroupInfo(unit, sortMode);
    }

    function buildGroupPerimeterStyle(r, c, cellMap) {
      const cell = cellMap[`${r},${c}`];
      if (!cell) return {};
      const hex = cell.borderHex || '#38bdf8';
      const sameTop = cellMap[`${r - 1},${c}`]?.groupKey === cell.groupKey;
      const sameBottom = cellMap[`${r + 1},${c}`]?.groupKey === cell.groupKey;
      const sameLeft = cellMap[`${r},${c - 1}`]?.groupKey === cell.groupKey;
      const sameRight = cellMap[`${r},${c + 1}`]?.groupKey === cell.groupKey;

      const outerBorder = `2px solid ${hex}`;
      const innerBorder = `1px solid ${hex}33`;

      return {
        borderTop: sameTop ? innerBorder : outerBorder,
        borderBottom: sameBottom ? innerBorder : outerBorder,
        borderLeft: sameLeft ? innerBorder : outerBorder,
        borderRight: sameRight ? innerBorder : outerBorder,
        borderTopLeftRadius: (!sameTop && !sameLeft) ? '7px' : '2px',
        borderTopRightRadius: (!sameTop && !sameRight) ? '7px' : '2px',
        borderBottomLeftRadius: (!sameBottom && !sameLeft) ? '7px' : '2px',
        borderBottomRightRadius: (!sameBottom && !sameRight) ? '7px' : '2px',
        background: currentMode === 0
          ? `linear-gradient(180deg, ${hex}22 0%, rgba(15, 23, 42, 0.9) 100%)`
          : undefined,
        boxShadow: `0 0 8px ${hex}22`
      };
    }

    function attachGroupBadge(card, badgeInfo) {
      if (!badgeInfo || !badgeInfo.shortLabel) return;
      const hex = groupHexColors[badgeInfo.colorClass] || '#38bdf8';
      const badge = document.createElement('div');
      badge.className = 'group-cell-badge';
      badge.textContent = badgeInfo.shortLabel;
      badge.title = badgeInfo.shortLabel;

      if (badgeInfo.colorClass === 'theme-rainbow') {
        badge.classList.add('badge-rainbow');
      } else if (badgeInfo.colorClass === 'theme-glowingblack') {
        badge.classList.add('group-glowingblack');
      } else {
        badge.style.backgroundColor = '#090d16';
        badge.style.borderColor = hex;
        badge.style.color = hex;
        badge.style.boxShadow = `0 0 10px ${hex}55, 0 3px 6px rgba(0, 0, 0, 0.95)`;
      }
      card.appendChild(badge);
    }

    function createFighterCard(unit, mode = currentMode, badgeInfo = null, perimeterStyle = null) {
      const charName = getVariantName(unit, mode);
      const isDisabled = !charName || charName === "None";

      const card = document.createElement('div');
      card.className = `css-card ${getModeRoleClass(mode)} ${isDisabled ? 'disabled' : ''}`;

      if (perimeterStyle) {
        Object.assign(card.style, perimeterStyle);
      }
      if (badgeInfo) {
        attachGroupBadge(card, badgeInfo);
      }

      const badgesEl = document.createElement('div');
      badgesEl.className = 'card-badges';

      playerSelections.forEach((sel, pIdx) => {
        if (sel && sel.unit.id === unit.id) {
          card.classList.add(`selected-p${pIdx + 1}`);
          const chip = document.createElement('span');
          chip.className = `p-chip p-chip-${pIdx + 1}`;
          const vLetter = sel.variantType === 0 ? 'A' : (sel.variantType === 1 ? 'E' : 'K');
          chip.textContent = `P${pIdx + 1}·${vLetter}`;
          badgesEl.appendChild(chip);
        }
      });

      const numEl = document.createElement('div');
      numEl.className = 'card-num';
      numEl.textContent = `#${String(unit.id).padStart(3, '0')}`;

      const nameEl = document.createElement('div');
      nameEl.className = 'card-name';
      nameEl.textContent = isDisabled ? '— NONE —' : charName;

      if (!isDisabled) {
        card.appendChild(createCardImageElement(charName, mode));
      }
      card.appendChild(badgesEl);
      const activeSort = document.getElementById('sortSelect')?.value || 'slot';
      if (activeSort !== 'starter24' && activeSort !== 'unlocked72') {
        card.appendChild(numEl);
      }
      card.appendChild(nameEl);

      if (!isDisabled) {
        card.onclick = () => selectFighter(unit, mode);
      }

      return card;
    }

    function createSpecialCard(specialType, extraClass = '', perimeterStyle = null, badgeInfo = null) {
      const titles = { random: 'RANDOM', anchor: 'ANCHOR', echo: 'ECHO', kaizo: 'KAIZO' };
      const styleMap = {
        random: 'special-random',
        anchor: 'special-anchor',
        echo: 'special-echo',
        kaizo: 'special-kaizo'
      };
      const actionMap = {
        random: () => triggerRandomSelect(),
        anchor: () => setMode(0),
        echo: () => setMode(1),
        kaizo: () => setMode(2)
      };

      const card = document.createElement('div');
      card.className = `special-card ${styleMap[specialType] || ''} ${extraClass}`.trim();
      card.style.overflow = 'visible';

      if (perimeterStyle) {
        Object.assign(card.style, perimeterStyle);
      }
      if (badgeInfo) {
        attachGroupBadge(card, badgeInfo);
      }

      const span = document.createElement('span');
      span.className = 'special-title';
      span.textContent = titles[specialType] || specialType.toUpperCase();
      card.appendChild(span);
      card.onclick = actionMap[specialType] || (() => {});
      return card;
    }

    function buildFighterCard(unit, groupInfo = null, isGroupStart = false) {
      const badgeInfo = (groupInfo && isGroupStart && groupInfo.label)
        ? { shortLabel: groupInfo.label, colorClass: groupInfo.colorKey }
        : null;
      const card = createFighterCard(unit, currentMode, badgeInfo, null);
      if (groupInfo) {
        const hex = groupHexColors[groupInfo.colorKey] || '#38bdf8';
        card.style.borderColor = hex;
      }
      return card;
    }

    function getGridColumnCount() {
      const w = window.innerWidth;
      if (w <= 768) return 8;
      if (w <= 1280) return 10;
      return 15;
    }

    function createSpecialActionCard(title, styleClass, onClickFn) {
      const card = document.createElement('div');
      card.className = `special-card ${styleClass}`;
      const span = document.createElement('span');
      span.className = 'special-title';
      span.textContent = title;
      card.appendChild(span);
      card.onclick = onClickFn;
      return card;
    }

    function renderGrid() {
      const container = document.getElementById('gridContainer');
      const gridContainer = container;
      const sortMode = document.getElementById('sortSelect').value;
      const seriesVal = document.getElementById('seriesFilter').value;
      const searchVal = document.getElementById('searchInput').value.trim().toLowerCase();

      container.innerHTML = '';

      const isUnfiltered = seriesVal === 'ALL' && searchVal.length === 0;
      const isFiltering = !isUnfiltered;

      // Update grid CSS layout class
      container.className = 'grid-15';
      if (isUnfiltered && sortMode === 'starter24') {
        container.className = 'grid-starter-24';
      } else if (isUnfiltered && sortMode === 'unlocked72') {
        container.className = 'grid-unlocked-72';
      }

      // Filter roster
      let filtered = roster.filter(unit => {
        if (sortMode === 'starter24' && !STARTER_24_IDS.includes(unit.id)) return false;
        if (sortMode === 'unlocked72' && !UNLOCKED_72_IDS.includes(unit.id)) return false;
        if (seriesVal !== 'ALL' && unit.series !== seriesVal) return false;
        if (searchVal) {
          const matchAnchor = unit.anchor.toLowerCase().includes(searchVal);
          const matchEcho = unit.echo.toLowerCase().includes(searchVal);
          const matchKaizo = unit.kaizo.toLowerCase().includes(searchVal);
          const matchSeries = unit.series.toLowerCase().includes(searchVal);
          if (!matchAnchor && !matchEcho && !matchKaizo && !matchSeries) return false;
        }
        return true;
      });

      // Update counter badge
      const availableCount = filtered.filter(u => {
        const v = getVariantName(u, currentMode);
        return v && v !== 'None';
      }).length;
      const modeLabel = currentMode === 0 ? 'ANCHORS' : (currentMode === 1 ? 'ECHOES' : 'KAIZOS');
      document.getElementById('fighterCounterBadge').textContent = `${availableCount} ${modeLabel}`;

      // =========================================================================
      // ROYALE GROUPED SORTS (CHRONICLES, FACTIONS, ENSEMBLES, PANTHEON)
      // =========================================================================
      const isGroupedSort = ['history', 'corp', 'theme', 'pantheon'].includes(sortMode);
      if (isGroupedSort && isUnfiltered) {
        const units = [...filtered];
        container.className = 'grid-15 royale-grouped-grid';
        const cellMap = {};
        const badgeAnchors = new Set();

        if (sortMode === 'pantheon') {
          // Custom 15x8 Bento Block Placement
          PANTHEON_BLOCKS.forEach(block => {
            const groupUnits = units.filter(u => u.pantheonGroup === block.groupId).sort((a, b) => a.id - b.id);
            const gTitle = pantheonGroups[block.groupId];
            const gColorClass = pantheonThemeColors[block.groupId];
            const borderHex = groupHexColors[gColorClass] || '#38bdf8';

            if (block.coords) {
              block.coords.forEach(([r, c], idx) => {
                const u = groupUnits[idx];
                if (u) {
                  cellMap[`${r},${c}`] = {
                    unit: u,
                    groupKey: `p-${block.groupId}`,
                    borderHex,
                    colorClass: gColorClass,
                    shortLabel: gTitle
                  };
                  if (idx === 0) {
                    badgeAnchors.add(`${r},${c}`);
                  }
                }
              });
            } else {
              let idx = 0;
              for (let r = block.rStart; r <= block.rEnd; r++) {
                for (let c = block.cStart; c <= block.cEnd; c++) {
                  const u = groupUnits[idx++];
                  if (u) {
                    cellMap[`${r},${c}`] = {
                      unit: u,
                      groupKey: `p-${block.groupId}`,
                      borderHex,
                      colorClass: gColorClass,
                      shortLabel: gTitle
                    };
                    if (r === block.rStart && c === block.cStart) {
                      const badgeCol = block.groupId === 8 ? block.cStart + 1 : block.cStart;
                      badgeAnchors.add(`${r},${badgeCol}`);
                    }
                  }
                }
              }
            }
          });

          // Special Action Cards in Row 8, Cols 12-15
          const specials = ['random', 'anchor', 'echo', 'kaizo'];
          specials.forEach((sp, i) => {
            const c = 12 + i;
            cellMap[`8,${c}`] = {
              specialType: sp,
              groupKey: `sp-${sp}`,
              borderHex: sp === 'random' ? '#eab308' : sp === 'anchor' ? '#f8fafc' : sp === 'echo' ? '#06b6d4' : '#a855f7',
              colorClass: 'theme-gold',
              shortLabel: ''
            };
          });
        } else {
          // Sort units for Chronicles (Row-Major), Factions (Col-Major), Ensembles (Col-Major)
          if (sortMode === 'history') {
            units.sort((a, b) => a.historyYear - b.historyYear || a.id - b.id);
          } else if (sortMode === 'corp') {
            units.sort((a, b) => a.corpGroup - b.corpGroup || a.id - b.id);
          } else if (sortMode === 'theme') {
            units.sort((a, b) => a.themeGroup - b.themeGroup || a.id - b.id);
          }

          const isColumnMajor = (sortMode === 'corp' || sortMode === 'theme');
          const seenGroups = new Set();
          const groupCells = {};

          let curR = 1;
          let curC = 1;

          units.forEach((u, idx) => {
            const r = isColumnMajor ? curR : Math.floor(idx / 15) + 1;
            const c = isColumnMajor ? curC : (idx % 15) + 1;

            if (isColumnMajor) {
              curR++;
              const maxRowForCol = curC >= 12 ? 7 : 8;
              if (curR > maxRowForCol) {
                curR = 1;
                curC++;
              }
            }

            const gInfo = getGroupInfo(u, sortMode);
            const borderHex = groupHexColors[gInfo.colorClass] || '#38bdf8';

            cellMap[`${r},${c}`] = {
              unit: u,
              groupKey: `g-${gInfo.key}`,
              borderHex,
              colorClass: gInfo.colorClass,
              shortLabel: gInfo.title
            };

            if (!groupCells[gInfo.key]) groupCells[gInfo.key] = [];
            groupCells[gInfo.key].push({ r, c });

            if (!seenGroups.has(gInfo.key)) {
              seenGroups.add(gInfo.key);
              if (sortMode === 'theme') {
                if (gInfo.key === 3) {
                  badgeAnchors.add(`${r},${c + 1}`);
                } else if (gInfo.key === 5) {
                  badgeAnchors.add(`1,${c + 1}`);
                } else if (gInfo.key === 7 && r > 1) {
                  badgeAnchors.add(`1,${c + 1}`);
                } else {
                  badgeAnchors.add(`${r},${c}`);
                }
              }
            }
          });

          if (sortMode === 'history') {
            Object.entries(groupCells).forEach(([gKeyStr, cells]) => {
              const gKey = Number(gKeyStr);
              if (gKey === 3 || gKey === 4) {
                const leftmost = cells.reduce((best, cur) =>
                  (cur.c < best.c || (cur.c === best.c && cur.r < best.r)) ? cur : best
                );
                badgeAnchors.add(`${leftmost.r},${leftmost.c}`);
              } else {
                badgeAnchors.add(`${cells[0].r},${cells[0].c}`);
              }
            });
          }

          if (sortMode === 'corp') {
            Object.entries(groupCells).forEach(([gKeyStr, cells]) => {
              const gKey = Number(gKeyStr);
              if (gKey === 5) {
                const leftmostTop = cells.reduce((best, cur) =>
                  (cur.c < best.c || (cur.c === best.c && cur.r < best.r)) ? cur : best
                );
                badgeAnchors.add(`${leftmostTop.r},${leftmostTop.c}`);
              } else {
                const topLeft = cells.reduce((best, cur) =>
                  (cur.r < best.r || (cur.r === best.r && cur.c < best.c)) ? cur : best
                );
                badgeAnchors.add(`${topLeft.r},${topLeft.c}`);
              }
            });
          }

          // Place 4 Special Action Cards in Row 8, Cols 12-15
          const specials = ['random', 'anchor', 'echo', 'kaizo'];
          specials.forEach((sp, i) => {
            const c = 12 + i;
            cellMap[`8,${c}`] = {
              specialType: sp,
              groupKey: `sp-${sp}`,
              borderHex: sp === 'random' ? '#eab308' : sp === 'anchor' ? '#f8fafc' : sp === 'echo' ? '#06b6d4' : '#a855f7',
              colorClass: 'theme-gold',
              shortLabel: ''
            };
          });
        }

        // Render all 120 cells (8 rows x 15 cols) with unified outer group borders
        for (let r = 1; r <= 8; r++) {
          for (let c = 1; c <= 15; c++) {
            const key = `${r},${c}`;
            const cell = cellMap[key];
            if (!cell) continue;
            const perimeterStyle = buildGroupPerimeterStyle(r, c, cellMap);
            const badgeInfo = badgeAnchors.has(key)
              ? { shortLabel: cell.shortLabel, colorClass: cell.colorClass }
              : null;

            if (cell.specialType) {
              container.appendChild(createSpecialCard(cell.specialType, '', perimeterStyle, badgeInfo));
            } else {
              container.appendChild(createFighterCard(cell.unit, currentMode, badgeInfo, perimeterStyle));
            }
          }
        }
        return;
      }

      // Standard, Starting 24, Unlocked 72, Alpha, Series, or Filtered Grids
      if (sortMode === 'alpha') {
        filtered.sort((a, b) => {
          const nameA = getVariantName(a, currentMode);
          const nameB = getVariantName(b, currentMode);
          if (nameA === 'None') return 1;
          if (nameB === 'None') return -1;
          return nameA.localeCompare(nameB);
        });
      } else if (sortMode === 'seriesAlpha') {
        filtered.sort((a, b) => a.series.localeCompare(b.series) || a.id - b.id);
      } else if (sortMode === 'seriesChrono') {
        filtered.sort((a, b) => {
          const yA = seriesReleaseYear[a.series] || a.historyYear;
          const yB = seriesReleaseYear[b.series] || b.historyYear;
          if (yA !== yB) return yA - yB;
          return a.series.localeCompare(b.series) || a.id - b.id;
        });
      } else {
        filtered.sort((a, b) => a.id - b.id);
      }

      // Special 10x8 placement for Base Unlocked 72 (Cols 1-9 for fighters + Random at bottom of Col 10)
      if (!isFiltering && sortMode === 'unlocked72') {
        let unitIdx = 0;
        for (let row = 0; row < 8; row++) {
          for (let col = 0; col < 10; col++) {
            if (col < 9 && unitIdx < filtered.length) {
              gridContainer.appendChild(buildFighterCard(filtered[unitIdx++]));
            } else if (row === 7 && col === 9) {
              gridContainer.appendChild(createSpecialActionCard('RANDOM', 'special-random', () => triggerRandomSelect()));
            } else {
              const spacer = document.createElement('div');
              spacer.className = 'hidden md:block';
              gridContainer.appendChild(spacer);
            }
          }
        }
        return;
      }

      filtered.forEach(unit => {
        const charName = getVariantName(unit, currentMode);
        const isDisabled = !charName || charName === "None";

        const card = document.createElement('div');
        card.className = `css-card ${getModeRoleClass(currentMode)} ${isDisabled ? 'disabled' : ''}`;

        const badgesEl = document.createElement('div');
        badgesEl.className = 'card-badges';
        playerSelections.forEach((sel, pIdx) => {
          if (sel && sel.unit.id === unit.id) {
            card.classList.add(`selected-p${pIdx + 1}`);
            const chip = document.createElement('span');
            chip.className = `p-chip p-chip-${pIdx + 1}`;
            const vLetter = sel.variantType === 0 ? 'A' : (sel.variantType === 1 ? 'E' : 'K');
            chip.textContent = `P${pIdx + 1}·${vLetter}`;
            badgesEl.appendChild(chip);
          }
        });

        const numEl = document.createElement('div');
        numEl.className = 'card-num';
        numEl.textContent = `#${String(unit.id).padStart(3, '0')}`;

        const nameEl = document.createElement('div');
        nameEl.className = 'card-name';
        nameEl.textContent = isDisabled ? '— NONE —' : charName;

        if (!isDisabled) {
          card.appendChild(createCardImageElement(charName, currentMode));
        }
        card.appendChild(badgesEl);
        if (sortMode !== 'starter24' && sortMode !== 'unlocked72') {
          card.appendChild(numEl);
        }
        card.appendChild(nameEl);

        if (!isDisabled) {
          card.onclick = () => selectFighter(unit, currentMode);
        }

        gridContainer.appendChild(card);
      });

      // Append Special Action Cards (#117-#120) when viewing full roster
      if (!isFiltering && sortMode === 'starter24') {
        gridContainer.appendChild(createSpecialActionCard('RANDOM', 'special-random', () => triggerRandomSelect()));
      } else if (!isFiltering && sortMode !== 'unlocked72') {
        gridContainer.appendChild(createSpecialActionCard('RANDOM', 'special-random', () => triggerRandomSelect()));
        gridContainer.appendChild(createSpecialActionCard('ANCHOR', 'special-anchor', () => setMode(0)));
        gridContainer.appendChild(createSpecialActionCard('ECHO', 'special-echo', () => setMode(1)));
        gridContainer.appendChild(createSpecialActionCard('KAIZO', 'special-kaizo', () => setMode(2)));
      }
    }

    // =========================================================================
    // 6. PLAYER SELECTION, MODE CYCLING & PORTRAIT SYNC
    // =========================================================================
    function setActivePlayer(pIdx) {
      activePlayer = pIdx;
      for (let i = 0; i < 4; i++) {
        const card = document.getElementById(`playerCard${i}`);
        card.classList.remove('active-p1', 'active-p2', 'active-p3', 'active-p4');
        if (i === activePlayer) {
          card.classList.add(`active-p${i + 1}`);
        }
      }
      playSfx('swap');
    }

    function selectFighter(unit, variantType) {
      const charName = getVariantName(unit, variantType);
      if (!charName || charName === 'None') return;

      playerSelections[activePlayer] = { unit, variantType };
      playSfx('select');
      updatePlayerUI(activePlayer);
      renderGrid();

      // Auto-advance to next empty player slot if available
      for (let offset = 1; offset <= 3; offset++) {
        const nextIdx = (activePlayer + offset) % 4;
        if (!playerSelections[nextIdx]) {
          setActivePlayer(nextIdx);
          break;
        }
      }
    }

    function switchPlayerVariant(pIdx, variantType) {
      const sel = playerSelections[pIdx];
      if (!sel) return;
      const charName = getVariantName(sel.unit, variantType);
      if (!charName || charName === 'None') return;

      sel.variantType = variantType;
      playSfx('swap');
      updatePlayerUI(pIdx);
      renderGrid();
    }

    function clearPlayerSelection(pIdx) {
      playerSelections[pIdx] = null;
      playSfx('clear');
      updatePlayerUI(pIdx);
      renderGrid();
    }

    function updatePlayerUI(pIdx) {
      const nameEl = document.getElementById(`p${pIdx+1}Name`);
      const tagEl = document.getElementById(`p${pIdx+1}VariantTag`);
      const switcherEl = document.getElementById(`p${pIdx+1}FormSwitcher`);
      const portraitEl = document.getElementById(`p${pIdx+1}Portrait`);
      const sortMode = document.getElementById('sortSelect')?.value || 'slot';
      const isAnchorOnlySort = sortMode === 'starter24' || sortMode === 'unlocked72';
      const sel = playerSelections[pIdx];

      if (sel && isAnchorOnlySort && sel.variantType !== 0) {
        sel.variantType = 0;
      }

      switcherEl.className = isAnchorOnlySort
        ? 'grid grid-cols-1 gap-1 mt-1 pt-1.5 border-t border-slate-700/60'
        : 'grid grid-cols-3 gap-1 mt-1 pt-1.5 border-t border-slate-700/60';

      if (!sel) {
        if (portraitEl) {
          portraitEl.src = "";
          portraitEl.classList.add('hidden');
        }
        nameEl.textContent = "SELECT CHARACTER";
        tagEl.textContent = isAnchorOnlySort
          ? "ANCHOR"
          : (currentMode === 0 ? "ANCHOR" : (currentMode === 1 ? "ECHO" : "KAIZO"));
        tagEl.className = "text-xs text-slate-400 font-bold";
        switcherEl.innerHTML = isAnchorOnlySort
          ? `<span class="text-[10px] text-slate-500 font-bold text-center py-0.5 bg-slate-900/60 rounded">ANCHOR</span>`
          : `
            <span class="text-[10px] text-slate-500 font-bold text-center py-0.5 bg-slate-900/60 rounded">ANCHOR</span>
            <span class="text-[10px] text-slate-500 font-bold text-center py-0.5 bg-slate-900/60 rounded">ECHO</span>
            <span class="text-[10px] text-slate-500 font-bold text-center py-0.5 bg-slate-900/60 rounded">KAIZO</span>
          `;
      } else {
        const activeVariant = isAnchorOnlySort ? 0 : sel.variantType;
        const charName = activeVariant === 0 ? sel.unit.anchor : (activeVariant === 1 ? sel.unit.echo : sel.unit.kaizo);
        if (portraitEl) {
          portraitEl.src = getCharacterImageUrl(charName, activeVariant);
          portraitEl.alt = charName;
          portraitEl.classList.remove('hidden');
        }
        nameEl.textContent = charName;

        const labels = ["ANCHOR", "ECHO", "KAIZO"];
        const tagColors = ["text-slate-200", "text-cyan-400", "text-purple-400"];
        tagEl.textContent = labels[activeVariant];
        tagEl.className = `text-xs font-extrabold ${tagColors[activeVariant]}`;

        // Render interactive Anchor / Echo / Kaizo form swap buttons
        const variants = isAnchorOnlySort
          ? [sel.unit.anchor]
          : [sel.unit.anchor, sel.unit.echo, sel.unit.kaizo];
        const btnStyles = [
          "border-slate-300 bg-slate-200 text-slate-950 font-black",
          "border-cyan-400 bg-cyan-500 text-slate-950 font-black",
          "border-purple-400 bg-purple-500 text-white font-black"
        ];

        switcherEl.innerHTML = variants.map((vName, vIdx) => {
          const disabled = !vName || vName === "None";
          const isActive = activeVariant === vIdx;
          if (disabled) {
            return `<button disabled title="No ${labels[vIdx]} variant" class="text-[10px] px-1 py-0.5 rounded bg-slate-900/40 text-slate-600 border border-slate-800 cursor-not-allowed truncate">—</button>`;
          }
          return `<button onclick="switchPlayerVariant(${pIdx}, ${vIdx})" title="${labels[vIdx]}: ${vName}" class="text-[10px] px-1 py-0.5 rounded border transition truncate ${isActive ? btnStyles[vIdx] : 'border-slate-700 bg-slate-800/80 text-slate-300 hover:border-slate-500'}">${vName}</button>`;
        }).join('');
      }
    }

    function setMode(modeIdx) {
      const sortMode = document.getElementById('sortSelect')?.value || 'slot';
      if ((sortMode === 'starter24' || sortMode === 'unlocked72') && modeIdx !== 0) {
        modeIdx = 0;
      }
      currentMode = modeIdx;
      const labelEl = document.getElementById('modeBtnLabel');
      labelEl.textContent = modeNames[currentMode];
      labelEl.className = currentMode === 0 ? "text-amber-400 font-bold" : (currentMode === 1 ? "text-cyan-400 font-bold" : "text-purple-400 font-bold");

      for (let i = 0; i < 4; i++) {
        if (!playerSelections[i]) updatePlayerUI(i);
      }
      playSfx('swap');
      renderGrid();
    }

    function cycleMode() {
      const sortMode = document.getElementById('sortSelect')?.value || 'slot';
      if (sortMode === 'starter24' || sortMode === 'unlocked72') {
        setMode(0);
        return;
      }
      setMode((currentMode + 1) % 3);
    }

    function toggleRandomMode() {
      isFullRandom = !isFullRandom;
      const labelEl = document.getElementById('randomToggleLabel');
      labelEl.textContent = isFullRandom ? "Full Random" : "Current View";
      labelEl.className = isFullRandom ? "text-amber-400 font-bold" : "text-slate-300 font-bold";
      playSfx('swap');
    }

    function triggerRandomSelect() {
      const sortMode = document.getElementById('sortSelect').value;
      const isAnchorOnlySort = sortMode === 'starter24' || sortMode === 'unlocked72';
      const pool = [];

      roster.forEach(unit => {
        if (sortMode === 'starter24' && !STARTER_24_IDS.includes(unit.id)) return;
        if (sortMode === 'unlocked72' && !UNLOCKED_72_IDS.includes(unit.id)) return;

        if (isFullRandom && !isAnchorOnlySort) {
          [0, 1, 2].forEach(vIdx => {
            const name = getVariantName(unit, vIdx);
            if (name && name !== 'None') pool.push({ unit, variantType: vIdx });
          });
        } else {
          const targetMode = isAnchorOnlySort ? 0 : currentMode;
          const name = getVariantName(unit, targetMode);
          if (name && name !== 'None') pool.push({ unit, variantType: targetMode });
        }
      });

      if (pool.length === 0) return;
      const pick = pool[Math.floor(Math.random() * pool.length)];
      playerSelections[activePlayer] = pick;
      playSfx('random');
      updatePlayerUI(activePlayer);
      renderGrid();
    }

    function handleSortChange() {
      const sortMode = document.getElementById('sortSelect').value;
      if ((sortMode === 'starter24' || sortMode === 'unlocked72') && currentMode !== 0) {
        currentMode = 0;
        const labelEl = document.getElementById('modeBtnLabel');
        labelEl.textContent = modeNames[0];
        labelEl.className = "text-amber-400 font-bold";
      }
      for (let i = 0; i < 4; i++) {
        updatePlayerUI(i);
      }
      playSfx('swap');
      renderGrid();
    }

            { num: "7", name: "Fighting Game Titans & Brawlers (Cols 5–8, Rows 5–6)", series: "No More Heroes, Guilty Gear, Street Fighter, Tekken, Fatal Fury / KOF, Virtua Fighter, Soulcalibur, Mortal Kombat", why: "World warriors, tournament champions, and lethal duelists (Travis Touchdown, Sol Badguy, Ryu, Kazuya Mishima, Terry Bogard, Akira Yuki, Siegfried, Scorpion) representing the pinnacle of arcade and 3D fighting game mastery." },

            { num: "10", name: "Life Simulators & Explorers (Cols 9–10, Rows 5–8)", series: "Pikmin, Animal Crossing, Wii Fit, Splatoon", why: "Everyday builders, island townsfolk, planetary explorers, and Turf War trendsetters (Captain Olimar, Pom & Oatchi, Villager, Timmy & Tommy, Blathers / Celeste, Wii Fit Trainer, Inkling, Squid Sisters) who turn daily routines, nature, and culture into creative combat." },

            { num: "14", name: "Dark Hunters & Covert Ops (Cols 12–15, Row 7)", series: "Metal Gear, Castlevania, Devil May Cry", why: "Nocturnal vampire hunters, half-demon devil slayers, and legendary stealth operatives (Solid Snake, Simon Belmont, Alucard, Dante) who operate in the shadows against supernatural and military threats." }
          ];

          html = `
            ${groupedPreludeHtml}
            <p class="text-slate-300 px-1">A custom 15×8 Bento Block Map divided into <strong>14 lore-driven crossover alliances</strong> (plus the Special Action Cards frame), intentionally stacking rival factions and thematic counterparts above and below one another:</p>
            <div class="space-y-2.5">
              ${pantheonEntries.map(entry => `
                <div class="p-3 rounded-lg bg-slate-900 border border-slate-700 space-y-1">
                  <div class="font-bold text-purple-300 text-sm">${entry.num}. ${entry.name}</div>

            </div>

      }

      bodyEl.innerHTML = html;
      document.getElementById('groupingModal').classList.remove('hidden');
      playSfx('swap');
    }

    function closeGroupingGuideModal() {
      document.getElementById('groupingModal').classList.add('hidden');
    }

    // Initialize Application
    window.addEventListener('DOMContentLoaded', init);
    window.addEventListener('resize', () => {
      const sortMode = document.getElementById('sortSelect')?.value;
      if (['history', 'corp', 'theme', 'pantheon'].includes(sortMode)) {
        renderGrid();
      }

  </script>
